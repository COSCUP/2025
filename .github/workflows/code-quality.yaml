name: Code Quality

on:
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      PRETALX_BASE_URL: ${{ secrets.PRETALX_BASE_URL }}
      PRETALX_TOKEN: ${{ secrets.PRETALX_TOKEN }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      VITE_COMMUNITY_SHEET_NAME: ${{ secrets.VITE_COMMUNITY_SHEET_NAME }}
      VITE_SHEET_ID: ${{ secrets.VITE_SHEET_ID }}
      VITE_SPONSOR_LEVELS_SHEET_NAME: ${{ secrets.VITE_SPONSOR_LEVELS_SHEET_NAME }}
      VITE_SPONSOR_NEWS_SHEET_NAME: ${{ secrets.VITE_SPONSOR_NEWS_SHEET_NAME }}
      VITE_SPONSOR_SHEET_NAME: ${{ secrets.VITE_SPONSOR_SHEET_NAME }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm lint

      - name: Check types
        run: pnpm type-check

      - name: Build with VitePress
        run: pnpm build
